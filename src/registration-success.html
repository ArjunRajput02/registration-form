<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You for Registering</title>
  <link href="registration.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

  <div class="bg-white rounded-xl shadow-lg p-8 max-w-md text-center">
    <!-- Icon -->
    <div class="bg-green-100 w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-6">
      <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <!-- Heading -->
    <h1 class="text-2xl font-semibold text-gray-800 mb-4">Thank You for Registering!</h1>

    <!-- Message -->
    <p class="text-gray-600 mb-6">
      We have received your registration successfully. Please check your email for further instructions.
    </p>

    <!-- Button -->
    <a href="registration.html" class="inline-block bg-green-600 text-white px-6 py-2 rounded-lg shadow hover:bg-green-700 transition">
      Go to Homepage
    </a>
  </div>

</body>
</html>
