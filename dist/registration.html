<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="registration.css" rel="stylesheet">
</head>
<body class="bg-slate-100 flex items-center justify-center ">
    <div class="w-225 max-w-full flex md:flex-row flex-col md:mt-10 rounded-xl shadow-xl overflow-hidden bg-sky-400">
           <div class="md:w-1/2 w-full p-10 bg-amber-50">
             <h2 class="text-xl font-semibold text-indigo-800 mb-6">
                General Information
             </h2>

             <form class="space-y-4">
                <select class="w-full border rounded-md px-3 py-2 text-grey-500">
                    <option>Title</option>
                    <option>Mr.</option>
                    <option>Mrs.</option>
                </select>
                <div class="flex md:flex-row flex-col gap-4">
                    <input type="Text" placeholder="First Name" class="md:w-1/2 w-full border rounded-md px-3 py-2 text-grey-500">
                    <input type="Text" placeholder="Last Name" class="md:w-1/2 w-full border rounded-md px-3 py-2 text-grey-500">
                </div>

                <select placeholder="Position" class="w-full border rounded-md px-3 py-2 text-grey-500">
                    <option>Position</option>
                    <option>Manager</option>
                    <option>Developer</option>
                </select>

                <input placeholder="Position" class="w-full border rounded-md px-3 py-2 text-grey-500">

                <div class="flex md:flex-row flex-col gap-4">
                    <input type="Text" placeholder="Bussiness Area" class="md:w-1/2 w-full border rounded-md px-3 py-2 text-grey-500">
                    <select placeholder="Employees" class="md:w-1/2 w-full border rounded-md px-3 py-2 text-grey-500">
                        <option>Employees</option>
                        <option>Interns</option>
                        <option>Human Resources</option>
                    </select>
                </div>
             </form>
           </div>
           <div class="md:w-1/2 w-full p-10 linear-to-b from-indigo-500 to-blue-500">
             <h2 class="text-xl font-semibold text-amber-50 mb-6" >
                 Contact Details
             </h2>
           
           <form class="space-y-4">
            <input type="text" placeholder="St+Near" class="w-full border bg-transparent border-white rounded-md px-3 py-2 placeholder-white">
            <input type="text" placeholder="Additional Information" class="w-full border bg-transparent border-white rounded-md px-3 py-2 placeholder-white">
            <div class="flex flex-col md:flex-row gap-4">
                    <input type="Text" placeholder="Zipcode" class="md:w-2/6 w-full border border-white rounded-md bg-transparent  px-3 py-2 placeholder-white">
                    <input type="Text" placeholder="Place" class="md:w-4/6 w-full border border-white rounded-md bg-transparent px-3 py-2 placeholder-white">
                </div>
              <input type="text" placeholder="Country" class="w-full border bg-transparent border-white rounded-md px-3 py-2 placeholder-white">  
            <div class="flex md:flex-row flex-col gap-4">
                    <input type="text" placeholder="code+" class="md:w-1/6 w-full border border-white rounded-md bg-transparent  px-3 py-2 placeholder-white">
                    <input type="text" placeholder="Phone Number" class="md:w-5/6 w-full border border-white rounded-md bg-transparent px-3 py-2 placeholder-white">
                </div>
                <input type="email" placeholder="Your Email" class="w-full border bg-transparent border-white rounded-md px-3 py-2 placeholder-white">  
            <div class="flex items-center gap-2 text-sm">
                <input type="checkbox" class="accent-white" required>
            <span>
                I do accept the
                <a href="#" class="underline" target="_blank">Terms and Conditions</a>
                of your site.
            </span>
            </div>

            <button class="mt-4 bg-white text-indigo-600 font semibold px-6 py-2 rounded-md hover:bg-red-500 transition">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
